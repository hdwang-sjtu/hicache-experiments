# 模型、服务和测量配置在同一份文件；命令行可覆盖。
model:
  repo: Qwen/Qwen3.5-35B-A3B-FP8
  revision: 9d1823d2dee688a6b25e77009dc727688c44936e
server:
  load-format: dummy
  routing: round-robin
  prefill-graph: breakable
  env:
    SGLANG_ENABLE_METRICS_DEVICE_TIMER: '1'
    SGLANG_UNIFIED_RADIX_TREE_CORE_BACKEND: python
  sglang:
    context-length: 16384
    max-total-tokens: 32768
    dtype: bfloat16
    kv-cache-dtype: bfloat16
    tp-size: 1
    host: 127.0.0.1
    port: 39081
    mem-fraction-static: 0.92
    max-running-requests: 1
    chunked-prefill-size: 16384
    page-size: 1
    cuda-graph-backend-decode: disabled
    enable-metrics: true
    return-output-ids: true
    enable-hierarchical-cache: true
    enable-hicache-experiment: true
    hicache-host-memory-mode: cache
    hicache-write-policy: write_through
    hicache-size: 8
    hicache-io-backend: kernel
    hicache-mem-layout: page_first
    ep-size: 1
    pp-size: 1
    dp-size: 1
    max-mamba-cache-size: 32
    mamba-radix-cache-strategy: extra_buffer
    mamba-track-interval: 256
    enable-metrics-for-all-schedulers: true
    skip-server-warmup: true
    random-seed: 0
test:
  prefix-lengths:
  - 2k
  - 4k
  suffix-lengths:
  - 128
  - 512
  groups:
  - cold
  - l1
  - l2
  output-length: 1
  repeats: 3
  gpu-timing: true
  ready-timeout: 1800
